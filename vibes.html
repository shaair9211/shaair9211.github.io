<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#111111;
    --panel:#1a1a1a;
    --panel-2:#161616;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.16);
    --text: #f2f1ee;
    --text-dim: #9a9a9a;
    --text-faint: #6b6b6b;
    --red: #780606;
    --red-bright: #a30d0d;
    --red-tint: rgba(120,6,6,.14);

    --tile-w: 4;
    --tile-h: 5;
    --tile-unit: 190px;
    --tile-gap: 4px;
  }

  *{ box-sizing:border-box; }

  body{
    background: #111111;
    overflow-x:hidden;
    margin:0;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .background-texture {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 8px 8px;
    opacity: .5;
    pointer-events: none;
  }
  .background{
    position:fixed;
    inset:0;
    z-index:-5;
    pointer-events:none;
    overflow:hidden;
  }
  .background-scroll{
    position:absolute;
    inset:0px;
  }


  .back-btn{
    position: fixed;
    top: 22px;
    left: 22px;
    z-index: 50;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: .85rem;
    letter-spacing:.02em;
    color: var(--text-dim);
    background: rgba(17,17,17,.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    padding: 9px 14px;
    border-radius: 4px;
    text-decoration: none;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }
  .back-btn:hover, .back-btn:focus-visible{
    color: #fff;
    border-color: var(--red);
    background: var(--red-tint);
  }
  .back-btn span{ color: var(--red); }

  .to-top{
    position: fixed;
    bottom: 22px;
    right: 22px;
    z-index: 50;
    width: 46px;
    height: 46px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(17,17,17,.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--text-dim);
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, color .2s ease, border-color .2s ease, background .2s ease;
  }
  .to-top.visible{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .to-top:hover, .to-top:focus-visible{
    color:#fff;
    border-color: var(--red);
    background: var(--red-tint);
  }
  .to-top svg{ width:18px; height:18px; }

  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 2px;
  }


  main{
    position:relative;
    max-width: 1180px;
    margin: 0 auto;
    padding: 120px 32px 100px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .eyebrow span{ color: var(--red); }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 4.2vw, 3.1rem);
    margin: 18px 0 20px;
    letter-spacing: -.01em;
  }

  .lede{
    max-width: 640px;
    color: var(--text-dim);
    font-size: 1.02rem;
    line-height: 1.65;
    margin: 0 0 28px;
  }

  .laneline{
    width: 100%;
    height: 1px;
    background-image: repeating-linear-gradient(
      to right,
      var(--line-strong) 0px, var(--line-strong) 22px,
      transparent 22px, transparent 40px
    );
    margin: 0 0 8px;
  }


  .cat-filter{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 28px 0 36px;
  }

  .cat-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: .78rem;
    letter-spacing: .04em;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }
  .cat-btn:hover{
    color: var(--text);
    border-color: var(--line-strong);
  }
  .cat-btn[aria-pressed="true"]{
    color: #fff;
    background: var(--red-tint);
    border-color: var(--red);
  }
  .cat-btn .count{
    color: var(--text-faint);
    margin-left: 6px;
  }
  .cat-btn[aria-pressed="true"] .count{
    color: rgba(255,255,255,.7);
  }

  .photo.cat-hidden{
    display: none;
  }

  @media (max-width: 560px){
    .cat-filter{ gap: 6px; margin: 22px 0 28px; }
    .cat-btn{ padding: 7px 13px; font-size: .74rem; }
  }


  .gallery{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile-unit), 1fr));
    grid-auto-flow: dense;
    grid-auto-rows: calc(var(--tile-unit) * var(--tile-h) / var(--tile-w));
    gap: var(--tile-gap);
    margin-top: 54px;
  }

  .photo{ grid-column: span 1; grid-row: span 1; }
  .photo.tile-wide{ grid-column: span 2; grid-row: span 1; }
  .photo.tile-tall{ grid-column: span 1; grid-row: span 2; }
  .photo.tile-big{  grid-column: span 2; grid-row: span 2; }

  .photo{
    position: relative;
    margin: 0;
    border-radius: 0;
    overflow: hidden;
    cursor: pointer;
    background: var(--panel-2);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .6s ease, transform .4s ease, background-color .2s ease;
  }
  .photo.in-view{
    opacity: 1;
    transform: translateY(0);
  }

  .photo img{
    display:block;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .photo::after{
    content:"";
    position:absolute;
    inset:0;
    background: transparent;
    border: 1px solid transparent;
    transition: border-color .2s ease, background-color .2s ease;
    pointer-events:none;
  }
  .photo:hover::after{
    border-color: rgba(120,6,6,.65);
    background: rgba(120,6,6,.10);
  }
  .photo:focus-visible{
    outline: 2px solid var(--red);
    outline-offset: 3px;
  }

  .fallback{
    display:none;
    position: absolute;
    inset: 0;
    align-items:center;
    justify-content:center;
    background: var(--panel-2);
    font-family:'JetBrains Mono', monospace;
    font-size: .68rem;
    color: var(--text-faint);
    text-align:center;
    padding: 0 10px;
  }

  .photo figcaption{
    position:absolute;
    text-align:center;
    left:0; right:0; bottom:0;
    padding: 24px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
    color: #e9e9e9;
    font-family:'Inter', sans-serif;
    font-size: .76rem;
    line-height: 1.4;
    pointer-events:none;
  }

  .photo[data-video] .play-badge{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .photo[data-video] .play-badge svg{
    width: 44px;
    height: 44px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.65));
  }

  @media (max-width: 900px){
    :root{ --tile-unit: 150px; }
  }
  @media (max-width: 560px){
    :root{ --tile-unit: 130px; --tile-gap: 3px; }
    .photo.tile-wide, .photo.tile-big{ grid-column: span 2; }
  }


  footer{
    margin-top: 70px;
    padding-top: 22px;
    border-top: 1px solid var(--line);

    font-family:'JetBrains Mono', monospace;
    font-size: .74rem;
    color: var(--text-faint);
    letter-spacing:.03em;

  .lightbox{

    inset: 0;
    z-index: 300;
    background: rgba(8,8,8,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity: 0;
    pointer-events:none;

  .lightbox.open{

  }

  .lb-content{
    max-width: 90vw;
    max-height: 86vh;
    margin: 0;
    display:flex;
    flex-direction: column;
    align-items:center;
  }
  .lb-content img{
    max-width: 90vw;
    max-height: 78vh;
    object-fit: contain;
    display:block;
    border-radius: 2px;
  }
  .lb-content video{
    max-width: 90vw;
    max-height: 78vh;
    display:none;
    border-radius: 2px;
    background:#000;

  .lb-content figcaption{
    margin-top: 14px;
    color: var(--text-dim);
    font-family:'Inter', sans-serif;
    font-size: .88rem;
    font-style: italic;
    text-align:center;
    max-width: 70vw;
  }

  .lb-btn{
    position: fixed;
    z-index: 310;
    display:flex;
    align-items:center;
    justify-content:center;
    width: 44px;
    height: 44px;
    background: rgba(17,17,17,.7);
    backdrop-filter: blur(8px);
    border: 1px solid var(--line-strong);
    border-radius: 4px;
    color: var(--text-dim);
    font-size: 1.3rem;
    line-height:1;
    cursor:pointer;
    transition: color .2s ease, border-color .2s ease, background .2s ease;
  }
  .lb-btn:hover, .lb-btn:focus-visible{
    color:#fff;
    border-color: var(--red);
    background: var(--red-tint);
  }
  .lb-close{ top: 22px; right: 22px; }
  .lb-prev{ left: 22px; top: 50%; transform: translateY(-50%); }
  .lb-next{ right: 22px; top: 50%; transform: translateY(-50%); }

  .lb-counter{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family:'JetBrains Mono', monospace;
    font-size: .72rem;
    letter-spacing: .06em;
    color: var(--text-faint);
    z-index: 310;
  }

  @media (max-width: 640px){
    main{ padding: 100px 20px 80px; }
    .back-btn{ top:16px; left:16px; padding:8px 12px; font-size:.78rem; }
    .to-top{ bottom:16px; right:16px; width:42px; height:42px; }
    .lb-btn{ width:38px; height:38px; font-size:1.1rem; }
    .lb-close{ top:14px; right:14px; }
    .lb-prev{ left:14px; }
    .lb-next{ right:14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
    .photo{ opacity:1 !important; transform:none !important; }
  }
</style>
</head>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-btn lb-close" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" aria-label="Previous photo">‹</button>
    <button class="lb-btn lb-next" aria-label="Next photo">›</button>
    <figure class="lb-content">
      <img id="lb-img" src="" alt="">
      <video id="lb-video" controls loop playsinline preload="metadata"></video>
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <div class="lb-counter" id="lb-counter" aria-live="polite"></div>
  </div>

<script>

  const toTopBtn = document.querySelector('.to-top');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 420) toTopBtn.classList.add('visible');
    else toTopBtn.classList.remove('visible');
  }, { passive: true });
  toTopBtn.addEventListener('click', () => {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  const catButtons = Array.from(document.querySelectorAll('.cat-btn'));
  const allPhotosForFilter = Array.from(document.querySelectorAll('.gallery .photo'));

  catButtons.forEach((btn) => {
    const filter = btn.dataset.filter;
    const count = filter === 'all'
      ? allPhotosForFilter.length
      : allPhotosForFilter.filter((p) => (p.dataset.category || '').split(' ').includes(filter)).length;
    const label = document.createElement('span');
    label.className = 'count';
    label.textContent = `(${count})`;
    btn.appendChild(label);
  });

  function applyFilter(filter){
    allPhotosForFilter.forEach((p) => {
      const cats = (p.dataset.category || '').split(' ');
      const show = filter === 'all' || cats.includes(filter);
      p.classList.toggle('cat-hidden', !show);
    });
  }

  catButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      catButtons.forEach((b) => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      applyFilter(btn.dataset.filter);
    });
  });

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    allPhotosForFilter.forEach((p) => io.observe(p));
  } else {
    allPhotosForFilter.forEach((p) => p.classList.add('in-view'));
  }

  const gallery = document.querySelector('.gallery');
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbVideo = document.getElementById('lb-video');
  const lbCaption = document.getElementById('lb-caption');
  const lbCounter = document.getElementById('lb-counter');
  let current = 0;
  let lastFocused = null;


  function visiblePhotos(){
    return allPhotosForFilter.filter((p) => !p.classList.contains('cat-hidden'));
  }

  function stopVideo(){
    lbVideo.pause();
    lbVideo.removeAttribute('src');
    lbVideo.load();
    lbVideo.style.display = 'none';
  }

  function showPhoto(i){
    const list = visiblePhotos();
    current = (i + list.length) % list.length;
    const fig = list[current];
    const img = fig.querySelector('img');
    const cap = fig.querySelector('figcaption');
    const videoSrc = fig.dataset.video;

    if (videoSrc) {
      lbImg.style.display = 'none';
      lbImg.src = '';
      lbVideo.pause();
      lbVideo.poster = img.src;
      lbVideo.src = videoSrc;
      lbVideo.style.display = 'block';
      lbVideo.load();

      const playPromise = lbVideo.play();
      if (playPromise && playPromise.catch) playPromise.catch(() => {});
    } else {
      stopVideo();
      lbImg.src = fig.dataset.full || img.src;
      lbImg.alt = img.alt || '';
      lbImg.style.display = 'block';
    }

    if (cap && cap.textContent.trim()){
      lbCaption.textContent = cap.textContent;
      lbCaption.style.display = 'block';
    } else {
      lbCaption.textContent = '';
      lbCaption.style.display = 'none';
    }
    lbCounter.textContent = (current + 1) + ' / ' + list.length;
  }

  function openLightbox(i){
    lastFocused = document.activeElement;
    showPhoto(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    lb.querySelector('.lb-close').focus();
  }

  function closeLightbox(){
    lb.classList.remove('open');
    document.body.style.overflow = '';
    stopVideo();
    if (lastFocused) lastFocused.focus();
  }

  gallery.addEventListener('click', (e) => {
    const fig = e.target.closest('.photo');
    if (!fig) return;
    openLightbox(visiblePhotos().indexOf(fig));
  });

  gallery.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const fig = e.target.closest('.photo');
    if (!fig) return;
    e.preventDefault();
    openLightbox(visiblePhotos().indexOf(fig));
  });

  document.querySelector('.lb-close').addEventListener('click', closeLightbox);
  document.querySelector('.lb-prev').addEventListener('click', () => showPhoto(current - 1));
  document.querySelector('.lb-next').addEventListener('click', () => showPhoto(current + 1));

  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (document.activeElement === lbVideo) return;
    if (e.key === 'ArrowLeft') showPhoto(current - 1);
    if (e.key === 'ArrowRight') showPhoto(current + 1);
  });

  let touchStartX = 0;
  lb.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(dx) > 50) {
      dx > 0 ? showPhoto(current - 1) : showPhoto(current + 1);
    }
  }, { passive: true });
</script>
